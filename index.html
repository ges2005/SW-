<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>İzometrik Strateji</title>
<meta name="theme-color" content="#06264d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Strateji">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;overflow:hidden;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;background:#06264d;font-family:system-ui,sans-serif;overscroll-behavior:none}
  canvas{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #hud{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;color:#fff;font-size:14px;background:#0008;padding:6px 10px;border-radius:8px;pointer-events:none}
  button{min-width:56px;min-height:48px;padding:0 14px;font-size:16px;border:0;border-radius:10px;background:#fffd;color:#111}
  button:active{background:#fff}
  #prod{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:8px}
  #prod button{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;min-height:64px;padding:0 6px;line-height:1.1}
  #prod b{font-size:24px;font-weight:400}
  #prod small{font-size:11px;opacity:.7}
  #sel{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:calc(max(10px,env(safe-area-inset-bottom)) + 76px);display:flex;gap:8px}
  #sel[hidden]{display:none}
  #sel button{min-height:48px;min-width:64px;background:#ffd24a;font-size:16px}
  button.on{background:#ffd24a;outline:3px solid #fff}
  #mute{position:fixed;top:calc(max(8px,env(safe-area-inset-top)) + 46px);right:8px;min-width:48px}
  #msg[hidden],#menu[hidden],#tut[hidden]{display:none}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  #menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;gap:14px;padding:max(24px,env(safe-area-inset-top)) 16px 24px;background:linear-gradient(#0b2a55,#050d1a);color:#fff;overflow:auto;font-size:18px;z-index:5}
  #menu h1{margin:8px 0 0;font-size:28px;text-align:center}
  #menu .lbl{margin-top:8px;opacity:.8;text-align:center}
  #menu .big{min-width:200px;min-height:60px;font-size:22px;background:#ffd24a;margin-top:18px;align-self:center}
  #tab-camp,#tab-quick{display:flex;flex-direction:column;gap:10px;width:min(420px,100%)}
  #tab-camp[hidden],#tab-quick[hidden]{display:none}
  #levels{display:flex;flex-direction:column;gap:8px}
  .level{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:58px;padding:8px 14px;text-align:left}
  .level small{opacity:.65;font-size:13px}
  .level:disabled{opacity:.4}
  #seed{position:fixed;top:calc(max(8px,env(safe-area-inset-top)) + 50px);left:12px;color:#fffb;font-size:12px;text-shadow:0 1px 2px #000;pointer-events:none}
  #seed[hidden]{display:none}
  #tut{position:fixed;top:calc(max(8px,env(safe-area-inset-top)) + 46px);left:8px;right:64px;background:#ffd24aee;color:#111;border-radius:10px;padding:8px 10px;display:flex;gap:10px;align-items:center;font-size:14px;line-height:1.3}
  #tut p{margin:0;flex:1}
  #tut button{min-height:40px;min-width:56px;padding:0 10px;font-size:14px;background:#fff}
  #tut span{font-weight:700;opacity:.7}
  #msg{z-index:5;position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#000a;color:#fff;font-size:36px}
  /* yatay (kısa) ekran: düğmeler biraz küçülür */
  @media (max-height:520px){
    #prod button{min-height:52px;min-width:56px}
    #prod small{display:none}
    #sel{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 64px)}
    #sel button{min-height:42px}
    #menu{font-size:16px;gap:10px}
    #menu h1{font-size:22px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div><div id="seed" hidden></div>
<div id="sel" hidden><button id="stop">✋ Dur</button><button id="selclear" title="Seçimi bırak">✕</button></div>
<div id="prod">
  <button data-prod="piyon" title="Piyon"><b>⚔️</b><small>Piyon</small></button>
  <button data-prod="okcu" title="Okçu"><b>🏹</b><small>Okçu</small></button>
  <button data-prod="zirh" title="Zırhlı"><b>🛡️</b><small>Zırhlı</small></button>
</div>
<button id="mute">🔊</button>
<div id="tut" hidden><span id="tut-n"></span><p id="tut-text"></p><button id="tut-skip">Atla</button></div>
<div id="menu">
  <h1>İzometrik Strateji</h1>
  <div class="row tabs"><button data-tab="camp" class="on">Bölümler</button><button data-tab="quick">Hızlı oyun</button></div>
  <div id="tab-camp"><div id="levels"></div></div>
  <div id="tab-quick" hidden>
    <div class="lbl">Zorluk</div>
    <div class="row"><button data-diff="kolay">Kolay</button><button data-diff="normal">Normal</button><button data-diff="zor">Zor</button></div>
    <div class="lbl">Rakip sayısı</div>
    <div class="row"><button data-en="1">1</button><button data-en="2">2</button><button data-en="3">3</button></div>
    <div class="lbl">Harita</div>
    <div class="row"><button data-map="rand">🎲 Rastgele</button><button data-map="classic">Klasik</button></div>
    <button id="play" class="big">Başla</button>
  </div>
</div>
<div id="msg" hidden><span></span><div class="row"><button id="next" hidden>Sonraki bölüm</button><button id="retry">Yeniden dene</button><button id="restart">Menü</button></div></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
