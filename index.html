<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>İzometrik Strateji</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#06264d;font-family:system-ui,sans-serif;overscroll-behavior:none}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;-webkit-user-select:none;user-select:none}
  #hud{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;color:#fff;font-size:14px;background:#0008;padding:6px 10px;border-radius:8px;pointer-events:none}
  #bar{position:fixed;left:max(8px,env(safe-area-inset-left));bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:8px}
  button{min-width:56px;min-height:48px;padding:0 14px;font-size:16px;border:0;border-radius:10px;background:#fffd;color:#111}
  button:active{background:#fff}
  #prod{position:fixed;left:max(8px,env(safe-area-inset-left));bottom:calc(max(8px,env(safe-area-inset-bottom)) + 58px);display:flex;gap:8px}
  #prod button{min-width:56px;font-size:22px}
  button.on{background:#ffd24a;outline:3px solid #fff}
  #cmd{position:fixed;right:max(8px,env(safe-area-inset-right));bottom:120px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
  #cmd button{min-width:88px;font-size:15px;padding:0 8px}
  #mute{position:fixed;top:calc(max(8px,env(safe-area-inset-top)) + 46px);right:8px;min-width:48px}
  #msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#000a;color:#fff;font-size:36px}
  #msg[hidden],#menu[hidden]{display:none}
  #menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#000b;color:#fff;font-size:30px}
  #menu .row{display:flex;gap:10px}
  #menu .big{min-width:200px;min-height:60px;font-size:22px;background:#ffd24a}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="prod"><button data-prod="piyon" title="Piyon">⚔️</button><button data-prod="okcu" title="Okçu">🏹</button><button data-prod="zirh" title="Zırhlı">🛡️</button></div>
<div id="cmd"><button id="mode"></button><button id="stop">✋ Dur</button><button data-group="0">1</button><button data-group="1">2</button><button data-group="2">3</button></div>
<div id="bar"><button id="all">Hepsi</button><button id="none">İptal</button><button id="base">Üs</button></div>
<button id="mute">🔊</button>
<div id="menu"><span>Zorluk</span><div class="row"><button data-diff="kolay">Kolay</button><button data-diff="normal">Normal</button><button data-diff="zor">Zor</button></div><button id="play" class="big">Başla</button></div>
<div id="msg" hidden><span></span><button id="restart">Yeniden başla</button></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
