name: Web oyununu yayınla (GitHub Pages)

# main dalına birleştirilince testler koşar, geçerse oyun GitHub Pages'e yayınlanır.
# Elle de çalıştırılabilir (Actions sekmesi > Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Tarayıcı testleri (uçtan uca + PWA)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run e2e
          npm run pwa

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Yayın klasörünü hazırla (sürüm kimliği hizmet çalışanına yazılır)
        run: npm run build:web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
