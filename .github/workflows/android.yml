name: Android APK derle

# Elle çalıştırılabilir (Actions > "Android APK derle" > Run workflow) ve main'e her birleştirmede çalışır.
# Çıktı: Actions çalıştırma sayfasındaki "strateji-debug-apk" dosyası (debug imzalı, telefona doğrudan kurulabilir).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Web dosyalarını derle ve Android projesine kopyala
        run: |
          npm run build:web
          npx cap sync android
      - name: Debug APK derle
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: strateji-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
